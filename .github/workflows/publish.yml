name: Publish signed threat intelligence
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Allow first publication only when the dedicated KV key does not exist
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['deploy/revocations.json']
permissions:
  contents: read
concurrency:
  group: twb-intelligence-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish a validated signed snapshot
        env:
          TWB_SIGNING_KEY_JSON: ${{ secrets.TWB_SIGNING_KEY_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TWB_KV_NAMESPACE_ID: ${{ vars.TWB_KV_NAMESPACE_ID }}
          TWB_RELEASE_CONFIG: deploy/release.public.json
          TWB_BOOTSTRAP: ${{ inputs.bootstrap && 'yes' || 'no' }}
        run: |
          export TWB_SIGNING_KEY_FILE="$RUNNER_TEMP/twb-signing.key"
          node -e 'require("node:fs").writeFileSync(process.env.TWB_SIGNING_KEY_FILE, process.env.TWB_SIGNING_KEY_JSON, {mode:0o600,flag:"wx"})'
          unset TWB_SIGNING_KEY_JSON
          npm run publish:feed
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/twb-signing.key"
